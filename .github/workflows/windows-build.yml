name: Build Windows

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "打包前运行 runtime 测试"
        required: false
        default: true
        type: boolean
      clean:
        description: "构建前清理旧产物"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "runtime/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "desktop/package.json"
      - "desktop/src-tauri/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: windows-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            windows-cargo-

      - name: Clean build outputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clean }}
        shell: pwsh
        run: |
          Remove-Item desktop\dist -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item runtime\build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item runtime\dist -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item desktop\src-tauri\target\release\bundle -Recurse -Force -ErrorAction SilentlyContinue

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python runtime dependencies
        shell: pwsh
        working-directory: runtime
        run: |
          py -3.12 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
          .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Run runtime tests
        if: ${{ github.event_name == 'push' || inputs.run_tests }}
        shell: pwsh
        working-directory: runtime
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Build Windows desktop bundles
        shell: pwsh
        run: npm run build:win

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          .\scripts\collect-windows-artifacts.ps1 `
            -TargetDir "desktop\src-tauri\target" `
            -OutputDir "artifacts\windows" `
            -SummaryFile $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v6
        with:
          name: OpController-windows-x64
          if-no-files-found: error
          path: artifacts/windows/*
