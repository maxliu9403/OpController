name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1"
        required: true
        type: string
      run_tests:
        description: "Run runtime tests before packaging"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows updater assets
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: release-windows-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            release-windows-cargo-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python runtime dependencies
        shell: pwsh
        working-directory: runtime
        run: |
          py -3.12 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
          .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Run runtime tests
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_tests) }}
        shell: pwsh
        working-directory: runtime
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Build Windows updater bundles
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:win:updater

      - name: Collect Windows release assets
        shell: pwsh
        run: |
          .\scripts\collect-windows-artifacts.ps1 `
            -TargetDir "desktop\src-tauri\target" `
            -OutputDir "release-assets\windows" `
            -SummaryFile $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-assets
          if-no-files-found: error
          path: release-assets/windows/*

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: windows

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows release assets
        uses: actions/download-artifact@v7
        with:
          name: release-windows-assets
          path: release-assets

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          nsis="$(find release-assets -maxdepth 1 -type f -name '*.exe' | head -n 1)"
          if [[ -z "$nsis" ]]; then
            echo "No NSIS .exe artifact found under release-assets" >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi
          sig="${nsis}.sig"
          if [[ ! -f "$sig" ]]; then
            echo "No updater signature found next to $nsis" >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi
          asset_name="$(basename "$nsis")"
          signature="$(tr -d '\r\n' < "$sig")"
          python - <<PY
import json
from datetime import datetime, timezone

tag = ${tag@Q}
version = ${version@Q}
asset_name = ${asset_name@Q}
signature = ${signature@Q}
payload = {
    "version": version,
    "notes": f"OpController {tag}",
    "pub_date": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
    "platforms": {
        "windows-x86_64-nsis": {
            "signature": signature,
            "url": f"https://github.com/${{ github.repository }}/releases/download/{tag}/{asset_name}",
        }
    },
}
with open("release-assets/latest.json", "w", encoding="utf-8") as f:
    json.dump(payload, f, indent=2, ensure_ascii=False)
    f.write("\\n")
PY
          cat release-assets/latest.json

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: OpController ${{ steps.release.outputs.tag }}
          body: OpController ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/*
