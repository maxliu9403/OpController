name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.1"
        required: true
        type: string
      run_tests:
        description: "Run runtime tests before packaging"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS updater assets
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: release-macos-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/src-tauri/Cargo.toml', 'desktop/src-tauri/tauri.conf.json', 'desktop/src-tauri/tauri.updater.conf.json', 'desktop/src-tauri/capabilities/**', 'desktop/src-tauri/src/**') }}
          restore-keys: |
            release-macos-cargo-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          version="${tag#v}"
          desktop_version="$(node -p "require('./desktop/package.json').version")"
          tauri_version="$(python3 -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')"
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("desktop/src-tauri/Cargo.toml","rb"))["package"]["version"])')"
          runtime_version="$(python3 -c 'import tomllib; print(tomllib.load(open("runtime/pyproject.toml","rb"))["project"]["version"])')"
          if [[ "$desktop_version" != "$version" || "$tauri_version" != "$version" || "$cargo_version" != "$version" || "$runtime_version" != "$version" ]]; then
            echo "Release tag $tag does not match source versions:" >&2
            echo "desktop/package.json=$desktop_version" >&2
            echo "desktop/src-tauri/tauri.conf.json=$tauri_version" >&2
            echo "desktop/src-tauri/Cargo.toml=$cargo_version" >&2
            echo "runtime/pyproject.toml=$runtime_version" >&2
            exit 1
          fi

      - name: Clean stale Tauri app outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop/src-tauri/target/release/bundle
          rm -f desktop/src-tauri/target/release/opcontroller-desktop
          cargo clean --manifest-path desktop/src-tauri/Cargo.toml -p opcontroller-desktop

      - name: Install Python runtime dependencies
        working-directory: runtime
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip setuptools wheel
          ./.venv/bin/python -m pip install -e ".[dev]"
          ./.venv/bin/python -m playwright install chromium

      - name: Run runtime tests
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_tests) }}
        working-directory: runtime
        run: ./.venv/bin/python -m pytest

      - name: Build macOS updater bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:mac:updater

      - name: Collect macOS release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets/macos
          cp desktop/src-tauri/target/release/bundle/macos/OpController.app.tar.gz release-assets/macos/
          cp desktop/src-tauri/target/release/bundle/macos/OpController.app.tar.gz.sig release-assets/macos/
          cp desktop/src-tauri/target/release/bundle/dmg/OpController_*_aarch64.dmg release-assets/macos/
          ls -lh release-assets/macos

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-macos-assets
          if-no-files-found: error
          path: release-assets/macos/*

  windows:
    name: Windows updater assets
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: release-windows-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'desktop/src-tauri/Cargo.toml', 'desktop/src-tauri/tauri.conf.json', 'desktop/src-tauri/tauri.updater.conf.json', 'desktop/src-tauri/capabilities/**', 'desktop/src-tauri/src/**') }}
          restore-keys: |
            release-windows-cargo-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify release version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $tag.TrimStart("v")
          $desktopVersion = node -p "require('./desktop/package.json').version"
          $tauriVersion = py -3.12 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])"
          $cargoVersion = py -3.12 -c "import tomllib; print(tomllib.load(open('desktop/src-tauri/Cargo.toml','rb'))['package']['version'])"
          $runtimeVersion = py -3.12 -c "import tomllib; print(tomllib.load(open('runtime/pyproject.toml','rb'))['project']['version'])"
          if ($desktopVersion -ne $version -or $tauriVersion -ne $version -or $cargoVersion -ne $version -or $runtimeVersion -ne $version) {
            Write-Error "Release tag $tag does not match source versions: desktop/package.json=$desktopVersion, tauri.conf.json=$tauriVersion, Cargo.toml=$cargoVersion, runtime/pyproject.toml=$runtimeVersion"
          }

      - name: Clean stale Tauri app outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force "desktop\src-tauri\target\release\bundle" -ErrorAction SilentlyContinue
          Remove-Item -Force "desktop\src-tauri\target\release\opcontroller-desktop.exe" -ErrorAction SilentlyContinue
          Remove-Item -Force "desktop\src-tauri\target\release\opcontroller-desktop.pdb" -ErrorAction SilentlyContinue
          cargo clean --manifest-path desktop/src-tauri/Cargo.toml -p opcontroller-desktop

      - name: Install Python runtime dependencies
        shell: pwsh
        working-directory: runtime
        run: |
          py -3.12 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip setuptools wheel
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"
          .\.venv\Scripts\python.exe -m playwright install chromium

      - name: Run runtime tests
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_tests) }}
        shell: pwsh
        working-directory: runtime
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Build Windows updater bundles
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:win:updater

      - name: Collect Windows release assets
        shell: pwsh
        run: |
          .\scripts\collect-windows-artifacts.ps1 `
            -TargetDir "desktop\src-tauri\target" `
            -OutputDir "release-assets\windows" `
            -SummaryFile $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-windows-assets
          if-no-files-found: error
          path: release-assets/windows/*

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows release assets
        uses: actions/download-artifact@v7
        with:
          name: release-windows-assets
          path: release-assets/windows

      - name: Download macOS release assets
        uses: actions/download-artifact@v7
        with:
          name: release-macos-assets
          path: release-assets/macos

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          notes_file="RELEASE_NOTES.md"
          if [ -f "$notes_file" ]; then
            cp "$notes_file" release-assets/release-notes.md
          else
            printf 'OpController %s\n' "$tag" > release-assets/release-notes.md
          fi
          RELEASE_TAG="$tag" \
          RELEASE_REPOSITORY="${{ github.repository }}" \
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          from datetime import datetime, timezone

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          repository = os.environ["RELEASE_REPOSITORY"]
          root = pathlib.Path("release-assets")
          notes = (root / "release-notes.md").read_text(encoding="utf-8").strip()
          win = next((root / "windows").glob("*.exe"))
          mac = root / "macos" / "OpController.app.tar.gz"
          win_version_match = re.search(r"_(\d+\.\d+\.\d+)_", win.name)
          if not win_version_match or win_version_match.group(1) != version:
              raise SystemExit(f"Windows asset version mismatch: tag={version}, asset={win.name}")
          if not mac.exists():
              raise SystemExit(f"Missing macOS updater asset: {mac}")
          platforms = {
              "windows-x86_64-nsis": {
                  "signature": pathlib.Path(str(win) + ".sig").read_text(encoding="utf-8").strip(),
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{win.name}",
              },
              "darwin-aarch64": {
                  "signature": pathlib.Path(str(mac) + ".sig").read_text(encoding="utf-8").strip(),
                  "url": f"https://github.com/{repository}/releases/download/{tag}/{mac.name}",
              },
          }
          payload = {
              "version": version,
              "notes": notes or f"OpController {tag}",
              "pub_date": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }
          (root / "latest.json").write_text(json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
          cat release-assets/latest.json

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: OpController ${{ steps.release.outputs.tag }}
          body_path: release-assets/release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/latest.json
            release-assets/macos/*
            release-assets/windows/*
